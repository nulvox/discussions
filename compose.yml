services:
  discussion:
    build: .
    volumes:
      - ./configs:/app/configs:ro
      - ./logs:/app/logs
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # Uncomment to use a specific config file (default: example-simple.yml)
      # - CONFIG_PATH=/app/configs/example-natural.yml
      # Terminal color support
      - TERM=${TERM:-xterm-256color}
      - COLORTERM=${COLORTERM}
    # uncomment below to access ollama on localhost
    # extra_hosts:
      # - "host.docker.internal:host-gateway"
    # Allocate a TTY for color support
    tty: true
